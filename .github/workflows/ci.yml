name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run -w apps/web typecheck

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    env:
      # Stub env so Next.js can validate at build time without a real Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run -w apps/web build

  validate-migrations:
    name: Validate SQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agencyos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Create auth/storage shims
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres agencyos_test -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE TABLE IF NOT EXISTS auth.users (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              email text UNIQUE,
              created_at timestamptz DEFAULT now()
            );
            CREATE SCHEMA IF NOT EXISTS storage;
            CREATE TABLE IF NOT EXISTS storage.objects (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              bucket_id text,
              name text,
              owner uuid,
              created_at timestamptz DEFAULT now()
            );
          "

      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f …"
            PGPASSWORD=postgres psql -h localhost -U postgres agencyos_test -f "$f"
          done

      - name: Apply seed
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres agencyos_test -f supabase/seed.sql
