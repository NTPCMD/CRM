<title>AgencyOS — Interactive UI Prototype</title>
<style>
  :root{
    /* cool-slate neutrals biased toward the blue accent */
    --bg:#0b1220; --surface:#111827; --card:#1f2937; --card-2:#243044;
    --border:#2b3648; --border-strong:#374151;
    --text:#f9fafb; --muted:#9ca3af; --faint:#6b7280;
    --primary:#3b82f6; --primary-ink:#ffffff; --primary-soft:rgba(59,130,246,.14);
    --success:#22c55e; --warning:#f59e0b; --danger:#ef4444;
    --success-soft:rgba(34,197,94,.14); --warning-soft:rgba(245,158,11,.14); --danger-soft:rgba(239,68,68,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
    --radius:12px; --radius-sm:8px;
    --sidebar:248px; --topbar:60px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){ :root{ --light:1 } }
  :root[data-theme="light"], :root:not([data-theme="dark"]) {}
  /* light token set applied via .lighten class toggled from JS-independent media + attr */
  :root[data-theme="light"]{
    --bg:#f5f7fa; --surface:#ffffff; --card:#ffffff; --card-2:#f8fafc;
    --border:#e6e9ef; --border-strong:#d5dbe6;
    --text:#0b1220; --muted:#5b6472; --faint:#8a93a3;
    --primary:#2563eb; --primary-soft:rgba(37,99,235,.10);
    --success-soft:rgba(22,163,74,.12); --warning-soft:rgba(217,119,6,.12); --danger-soft:rgba(220,38,38,.12);
    --shadow:0 1px 2px rgba(16,24,40,.06),0 12px 28px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f5f7fa; --surface:#ffffff; --card:#ffffff; --card-2:#f8fafc;
      --border:#e6e9ef; --border-strong:#d5dbe6;
      --text:#0b1220; --muted:#5b6472; --faint:#8a93a3;
      --primary:#2563eb; --primary-soft:rgba(37,99,235,.10);
      --success-soft:rgba(22,163,74,.12); --warning-soft:rgba(217,119,6,.12); --danger-soft:rgba(220,38,38,.12);
      --shadow:0 1px 2px rgba(16,24,40,.06),0 12px 28px rgba(16,24,40,.08);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font); background:var(--bg); color:var(--text);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono)}
  button{font-family:inherit}
  ::selection{background:var(--primary-soft)}

  /* ---------- app shell ---------- */
  .app{display:grid; grid-template-columns:var(--sidebar) 1fr; grid-template-rows:var(--topbar) 1fr;
       grid-template-areas:"brand top" "side main"; height:100vh; overflow:hidden}
  .brand{grid-area:brand; display:flex; align-items:center; gap:10px; padding:0 18px;
         border-right:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--surface)}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#6366f1);
        display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
  .brand b{font-size:15px;letter-spacing:-.2px}
  .brand .env{margin-left:auto;font-size:10px;color:var(--faint);border:1px solid var(--border);
        padding:2px 6px;border-radius:20px;text-transform:uppercase;letter-spacing:.08em}

  .topbar{grid-area:top; display:flex; align-items:center; gap:14px; padding:0 18px;
          border-bottom:1px solid var(--border); background:var(--surface)}
  .search{flex:1; max-width:520px; display:flex; align-items:center; gap:8px; cursor:text;
          background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:8px 12px; color:var(--muted)}
  .search:hover{border-color:var(--border-strong)}
  .search kbd{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint);
          border:1px solid var(--border); border-radius:5px; padding:1px 6px}
  .top-actions{margin-left:auto; display:flex; align-items:center; gap:6px}
  .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;
           color:var(--muted); display:grid; place-items:center; cursor:pointer; position:relative}
  .iconbtn:hover{background:var(--card); color:var(--text)}
  .iconbtn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
  .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}

  /* ---------- sidebar ---------- */
  .side{grid-area:side; background:var(--surface); border-right:1px solid var(--border);
        display:flex; flex-direction:column; overflow:hidden}
  .switcher{padding:12px; border-bottom:1px solid var(--border)}
  .switcher label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:0 4px 6px;display:block}
  .seg{display:flex; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px}
  .seg button{flex:1; border:0; background:transparent; color:var(--muted); font-size:11.5px; font-weight:600;
        padding:6px 4px; border-radius:6px; cursor:pointer}
  .seg button[aria-selected="true"]{background:var(--card); color:var(--text); box-shadow:var(--shadow)}
  .nav{flex:1; overflow-y:auto; padding:10px 10px 20px}
  .nav .group{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 8px 6px}
  .nav a{display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:8px; color:var(--muted);
         text-decoration:none; font-size:13.5px; font-weight:500; cursor:pointer; margin-bottom:1px}
  .nav a svg{width:17px;height:17px;flex:none;opacity:.85}
  .nav a:hover{background:var(--card); color:var(--text)}
  .nav a.active{background:var(--primary-soft); color:var(--primary)}
  .nav a.active svg{opacity:1}
  .nav a .tag{margin-left:auto;font-size:10.5px;background:var(--card-2);color:var(--muted);border-radius:20px;padding:1px 7px}
  .side-foot{padding:10px 12px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px}
  .side-foot .who{min-width:0}
  .side-foot .who b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-foot .who span{font-size:11px;color:var(--faint)}

  /* ---------- main ---------- */
  .main{grid-area:main; overflow-y:auto; padding:22px 26px 60px}
  .page-head{display:flex; align-items:flex-end; gap:14px; margin-bottom:20px; flex-wrap:wrap}
  .page-head h1{font-size:24px; margin:0; letter-spacing:-.4px; text-wrap:balance}
  .page-head p{margin:3px 0 0; color:var(--muted); font-size:13.5px}
  .page-head .spacer{flex:1}
  .btn{border:1px solid var(--border-strong); background:var(--card); color:var(--text); font-weight:600;
       font-size:13px; padding:8px 13px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
  .btn:hover{border-color:var(--faint)}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn svg{width:15px;height:15px}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
  .card .card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .card .card-h h3{margin:0;font-size:14px;font-weight:650}
  .card .card-h .spacer{flex:1}
  .card .card-h a{font-size:12px;color:var(--primary);text-decoration:none;cursor:pointer}
  .card .card-b{padding:16px}

  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .kpi .val{font-size:26px;font-weight:720;letter-spacing:-.5px;margin-top:8px}
  .kpi .delta{font-size:12px;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
  .up{color:var(--success)} .down{color:var(--danger)}
  .kpi .spark{margin-top:10px;height:34px;width:100%}

  .grid{display:grid;gap:16px}
  .g-2{grid-template-columns:1.6fr 1fr}
  .g-2b{grid-template-columns:1fr 1fr}
  @media (max-width:980px){.g-2,.g-2b{grid-template-columns:1fr}}

  /* pills / badges */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
        border:1px solid transparent;white-space:nowrap}
  .pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.green{color:var(--success);background:var(--success-soft)}
  .pill.amber{color:var(--warning);background:var(--warning-soft)}
  .pill.red{color:var(--danger);background:var(--danger-soft)}
  .pill.blue{color:var(--primary);background:var(--primary-soft)}
  .pill.grey{color:var(--muted);background:var(--card-2)}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);
           font-weight:600;padding:0 14px 10px}
  tbody td{padding:12px 14px;border-top:1px solid var(--border)}
  tbody tr:hover{background:var(--card-2)}
  .t-wrap{overflow-x:auto}
  .who-cell{display:flex;align-items:center;gap:10px}
  .prog{height:6px;border-radius:20px;background:var(--card-2);overflow:hidden;min-width:90px}
  .prog i{display:block;height:100%;background:var(--primary);border-radius:20px}

  /* kanban / pipeline */
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
  .col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-width:230px}
  .col-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:12.5px;font-weight:650}
  .col-h .cnt{margin-left:auto;color:var(--faint);font-weight:600;font-size:11px}
  .col-h .bar{width:8px;height:8px;border-radius:3px}
  .col-b{padding:0 10px 10px;display:flex;flex-direction:column;gap:9px;min-height:40px}
  .tcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px;cursor:grab;box-shadow:var(--shadow)}
  .tcard:hover{border-color:var(--border-strong)}
  .tcard .tt{font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.35}
  .tcard .meta{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11px}
  .tcard .meta .spacer{flex:1}
  .money{font-size:14px;font-weight:700}

  /* activity feed */
  .feed{display:flex;flex-direction:column}
  .feed li{list-style:none;display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--border)}
  .feed{margin:0;padding:0}
  .feed li:first-child{border-top:0}
  .feed .ico{width:30px;height:30px;border-radius:8px;background:var(--card-2);display:grid;place-items:center;color:var(--muted);flex:none}
  .feed .ico svg{width:15px;height:15px}
  .feed .txt{font-size:13px}
  .feed .txt b{font-weight:650}
  .feed .txt span{color:var(--faint);font-size:11.5px;display:block;margin-top:2px}

  /* AI card */
  .ai{background:linear-gradient(160deg,var(--primary-soft),transparent);border:1px solid var(--border)}
  .ai .card-h h3{display:flex;align-items:center;gap:8px}
  .ai .insight{display:flex;gap:10px;padding:9px 0;font-size:13px;border-top:1px dashed var(--border)}
  .ai .insight:first-child{border-top:0}
  .ai .insight .k{width:22px;height:22px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700}
  .ai .ask{display:flex;gap:8px;margin-top:12px}
  .ai .ask input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:8px 11px;color:var(--text);font-size:13px}
  .ai .ask input::placeholder{color:var(--faint)}

  /* permission matrix */
  .matrix td,.matrix th{padding:10px 14px}
  .switch{width:38px;height:22px;border-radius:20px;background:var(--card-2);border:1px solid var(--border);position:relative;cursor:pointer;display:inline-block}
  .switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:.15s}
  .switch.on{background:var(--primary-soft);border-color:var(--primary)}
  .switch.on i{left:18px;background:var(--primary)}
  @media (prefers-reduced-motion:reduce){.switch i{transition:none}}

  /* two-col detail cards */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .pcard .card-b{padding:15px 16px}
  .pcard .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .pcard .top .nm{font-weight:650;font-size:14px}
  .pcard .top .sub{font-size:11.5px;color:var(--faint)}
  .pcard .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px}
  .stack{display:flex;flex-direction:column;gap:16px}
  .empty{color:var(--faint);font-size:13px;padding:20px;text-align:center}

  /* command palette */
  .scrim{position:fixed;inset:0;background:rgba(3,7,18,.6);backdrop-filter:blur(3px);display:none;z-index:50;align-items:flex-start;justify-content:center;padding-top:12vh}
  .scrim.open{display:flex}
  .palette{width:min(560px,92vw);background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
  .palette input{width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);
       font-size:15px;padding:16px 18px;outline:none}
  .palette .results{max-height:340px;overflow-y:auto;padding:8px}
  .palette .res{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
  .palette .res:hover,.palette .res.sel{background:var(--card)}
  .palette .res .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-left:auto}
  .palette .res .ic{width:26px;height:26px;border-radius:7px;background:var(--card-2);display:grid;place-items:center;color:var(--muted)}
  .palette .res .ic svg{width:14px;height:14px}
  .hint{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--faint);display:flex;gap:14px}

  .muted{color:var(--muted)} .small{font-size:12px}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:26px 0 12px}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:var(--topbar) 1fr;grid-template-areas:"top" "main"}
    .brand,.side{display:none}
  }
</style>

<div class="app">
  <div class="brand">
    <div class="logo">A</div>
    <b>AgencyOS</b>
    <span class="env">Preview</span>
  </div>

  <header class="topbar">
    <div class="search" id="openPalette">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
      <span>Search projects, clients, invoices…</span>
      <kbd>⌘K</kbd>
    </div>
    <div class="top-actions">
      <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
      <button class="iconbtn" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot"></span>
      </button>
      <div class="avatar" id="topAvatar" style="background:#6366f1">CA</div>
    </div>
  </header>

  <aside class="side">
    <div class="switcher">
      <label>Viewing as</label>
      <div class="seg" role="tablist" id="portalSeg">
        <button role="tab" data-portal="ceo" aria-selected="true">CEO</button>
        <button role="tab" data-portal="worker" aria-selected="false">Worker</button>
        <button role="tab" data-portal="client" aria-selected="false">Client</button>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="avatar" id="footAvatar" style="background:#6366f1">CA</div>
      <div class="who">
        <b id="footName">Cara Nolan</b>
        <span id="footRole">CEO · Northwind Studio</span>
      </div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="scrim" id="scrim">
  <div class="palette" role="dialog" aria-label="Command palette">
    <input id="pInput" placeholder="Type a command or search…" autocomplete="off"/>
    <div class="results" id="pResults"></div>
    <div class="hint"><span>↑ ↓ to navigate</span><span>↵ to select</span><span>esc to close</span></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = (s,r=document)=>r.querySelector(s);
  const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
  const money = n => '$'+n.toLocaleString('en-US');

  /* ---------------- icons ---------------- */
  const I = {
    grid:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
    users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
    folder:'<path d="M4 5h5l2 2h9v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5z"/>',
    check:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
    doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
    invoice:'<path d="M6 2h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M9 8h4M9 12h6M9 16h6"/>',
    chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    plug:'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/>',
    bolt:'<path d="M13 2 3 14h7l-1 8 10-12h-7z"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 2h-5l-.4 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.4L2.6 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.5h5l.4-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z"/>',
    home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/>',
    dollar:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    sign:'<path d="M3 21s3-1 6-1 5 1 8 1M4 15l7-7 3 3-7 7-4 1z"/>',
  };
  const svg = (k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[k]||''}</svg>`;

  /* ---------------- mock data ---------------- */
  const people = {
    cara:{n:'Cara Nolan',r:'CEO',c:'#6366f1',i:'CA'},
    wade:{n:'Wade Ellis',r:'Designer',c:'#0ea5e9',i:'WE'},
    mira:{n:'Mira Shah',r:'Developer',c:'#14b8a6',i:'MS'},
    theo:{n:'Theo Park',r:'Strategist',c:'#f59e0b',i:'TP'},

    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${area}" fill="${color}" opacity=".12"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>
      <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.6" fill="${color}"/>

      return `<div class="page-head"><div><h1>Contracts</h1><p>Review, download, and sign</p></div></div>
        <div class="card"><div class="card-b" style="padding:6px 0"><div class="t-wrap"><table>
        <thead><tr><th>Document</th><th>Status</th><th>Activity</th><th></th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td><div class="who-cell">${svg('doc')}<b>${r[0]}</b></div></td><td>${pillState(r[1],r[2])}</td>
          <td class="muted">${r[3]}</td><td style="text-align:right">${r[1]==='Signed'?'<button class="btn small">Download</button>':'<button class="btn primary small">'+svg('sign')+' Sign</button>'}</td></tr>`).join('')}</tbody>
        </table></div></div></div>`;
    },
    soon(){
      return `<div class="page-head"><div><h1>${curNavLabel()}</h1><p>This screen is part of the AgencyOS spec and comes online next.</p></div></div>
        <div class="card"><div class="card-b"><div class="empty" style="padding:56px 20px">
        <div style="width:46px;height:46px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 14px">${svg('bolt')}</div>
        <div style="font-size:15px;color:var(--text);font-weight:600;margin-bottom:4px">${curNavLabel()} — designed, wiring in progress</div>
        Every module shares this shell, design system, and permission model. Switch portals or open ⌘K to explore the built screens.
        </div></div></div>`;
    },
  };
  function projectsTable(list){
    return `<div class="t-wrap"><table><thead><tr><th>Project</th><th>Progress</th><th>Health</th><th>Due</th><th>Team</th></tr></thead>
      <tbody>${list.map(p=>`<tr><td><b>${p.n}</b><div class="small muted">${p.cl}</div></td>
        <td><div style="display:flex;align-items:center;gap:9px"><div class="prog"><i style="width:${p.prog}%"></i></div><span class="small num muted">${p.prog}%</span></div></td>
        <td>${pillState(p.health==='green'?'On track':p.health==='amber'?'At risk':'Off track',p.health)}</td>
        <td class="muted">${p.due}</td><td><div style="display:flex">${p.team.map(k=>av(people[k])).join('')}</div></td></tr>`).join('')}</tbody></table></div>`;
  }

  let _curLabel='';
  function curNavLabel(){return _curLabel;}

  /* ---------------- render ---------------- */
  function renderNav(){
    const cfg=portals[state.portal];
    const nav=$('#nav'); nav.innerHTML='';
    if(state.portal==='ceo') nav.appendChild(el(`<div class="group">Workspace</div>`));
    cfg.nav.forEach(([label,icon,view],idx)=>{
      const a=el(`<a data-view="${view}" data-label="${label}">${svg(icon)}<span>${label}</span>${view==='soon'?'':''}</a>`);
      if(view===state.view || (idx===0 && !cfg.nav.some(n=>n[2]===state.view))) {}
      nav.appendChild(a);
      a.addEventListener('click',()=>{ state.view=view; _curLabel=label; renderNav(); renderMain(); });
    });
    // mark active
    [...nav.querySelectorAll('a')].forEach(a=>{
      const on=a.dataset.view===state.view && a.dataset.label===_curLabel;
      a.classList.toggle('active', a.dataset.label===_curLabel);
    });
    // footer + avatar
    const u=cfg.user;
    $('#footName').textContent=u.n; $('#footRole').textContent=`${u.r} · ${cfg.sub}`;
    $('#footAvatar').textContent=u.i; $('#footAvatar').style.background=u.c;
    $('#topAvatar').textContent=u.i; $('#topAvatar').style.background=u.c;
  }
  function renderMain(){
    const fn=views[state.view]||views.soon;
    $('#main').innerHTML=fn();
    $('#main').scrollTop=0;
    // wire permission switches
    $('#main').querySelectorAll('.switch').forEach(s=>s.addEventListener('click',()=>{
      const on=s.classList.toggle('on'); s.setAttribute('aria-checked',on);
    }));
  }
  function setPortal(p){
    state.portal=p; const cfg=portals[p];
    state.view=cfg.nav[0][2]; _curLabel=cfg.nav[0][0];
    $('#portalSeg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.dataset.portal===p));
    renderNav(); renderMain();
  }
  $('#portalSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) setPortal(b.dataset.portal);});

  /* ---------------- theme ---------------- */
  $('#themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', isDark?'light':'dark');
  });

  /* ---------------- command palette ---------------- */
  const cmds=[
    ...projects.map(p=>({t:p.n,k:'Project',ic:'folder',go:['ceo','projects']})),
    ...Object.values(pipeline).flat().map(d=>({t:d.n,k:'Client',ic:'users',go:['ceo','crm']})),
    ...invoices.map(i=>({t:i.no+' · '+i.cl,k:'Invoice',ic:'invoice',go:['ceo','invoices']})),
    {t:'View CEO dashboard',k:'Go',ic:'grid',go:['ceo','dashboard']},
    {t:'Open CRM pipeline',k:'Go',ic:'users',go:['ceo','crm']},
    {t:'Team & permissions',k:'Go',ic:'shield',go:['ceo','team']},
    {t:'Switch to Worker portal',k:'Portal',ic:'check',go:['worker',null]},
    {t:'Switch to Client portal',k:'Portal',ic:'home',go:['client',null]},
  ];
  let sel=0, filtered=cmds;
  function openPalette(){ $('#scrim').classList.add('open'); $('#pInput').value=''; filtered=cmds; sel=0; drawResults(); $('#pInput').focus(); }
  function closePalette(){ $('#scrim').classList.remove('open'); }
  function drawResults(){
    $('#pResults').innerHTML=filtered.slice(0,8).map((c,i)=>`<div class="res ${i===sel?'sel':''}" data-i="${i}">
      <span class="ic">${svg(c.ic)}</span><span>${c.t}</span><span class="k">${c.k}</span></div>`).join('')||'<div class="empty">No matches</div>';
    $('#pResults').querySelectorAll('.res').forEach(r=>r.addEventListener('click',()=>run(filtered[+r.dataset.i])));
  }
  function run(c){ if(!c) return; closePalette(); if(c.go){ if(c.go[1]===null){setPortal(c.go[0]);} else {setPortal(c.go[0]); state.view=c.go[1]; _curLabel=(portals[c.go[0]].nav.find(n=>n[2]===c.go[1])||[])[0]||''; renderNav(); renderMain();} } }
  $('#openPalette').addEventListener('click',openPalette);
  $('#scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closePalette(); });
  $('#pInput').addEventListener('input',e=>{ const q=e.target.value.toLowerCase();
    filtered=cmds.filter(c=>c.t.toLowerCase().includes(q)||c.k.toLowerCase().includes(q)); sel=0; drawResults(); });
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); $('#scrim').classList.contains('open')?closePalette():openPalette();}
    if(!$('#scrim').classList.contains('open')) return;
    if(e.key==='Escape') closePalette();
    if(e.key==='ArrowDown'){e.preventDefault(); sel=Math.min(sel+1,Math.min(filtered.length,8)-1); drawResults();}
    if(e.key==='ArrowUp'){e.preventDefault(); sel=Math.max(sel-1,0); drawResults();}
    if(e.key==='Enter'){e.preventDefault(); run(filtered[sel]);}
  });

  /* ---------------- boot ---------------- */
  _curLabel='Dashboard';
  renderNav(); renderMain();
})();
</script>
