<title>AgencyOS — Interactive UI Prototype</title>
<style>
  :root{
    --bg:#0b1220; --surface:#111827; --card:#1f2937; --card-2:#243044;
    --border:#2b3648; --border-strong:#374151;
    --text:#f9fafb; --muted:#9ca3af; --faint:#6b7280;
    --primary:#3b82f6; --primary-ink:#fff; --primary-soft:rgba(59,130,246,.14);
    --success:#22c55e; --warning:#f59e0b; --danger:#ef4444; --violet:#8b5cf6;
    --success-soft:rgba(34,197,94,.14); --warning-soft:rgba(245,158,11,.14);
    --danger-soft:rgba(239,68,68,.14); --violet-soft:rgba(139,92,246,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.26);
    --radius:12px; --radius-sm:8px; --sidebar:250px; --topbar:60px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f5f7fa; --surface:#ffffff; --card:#ffffff; --card-2:#f3f5f9;
    --border:#e6e9ef; --border-strong:#d5dbe6;
    --text:#0b1220; --muted:#5b6472; --faint:#8a93a3;
    --primary:#2563eb; --primary-soft:rgba(37,99,235,.10);
    --success-soft:rgba(22,163,74,.12); --warning-soft:rgba(217,119,6,.12);
    --danger-soft:rgba(220,38,38,.12); --violet-soft:rgba(124,58,237,.12);
    --shadow:0 1px 2px rgba(16,24,40,.06),0 12px 28px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f5f7fa; --surface:#fff; --card:#fff; --card-2:#f3f5f9;
      --border:#e6e9ef; --border-strong:#d5dbe6;
      --text:#0b1220; --muted:#5b6472; --faint:#8a93a3;
      --primary:#2563eb; --primary-soft:rgba(37,99,235,.10);
      --success-soft:rgba(22,163,74,.12); --warning-soft:rgba(217,119,6,.12);
      --danger-soft:rgba(220,38,38,.12); --violet-soft:rgba(124,58,237,.12);
      --shadow:0 1px 2px rgba(16,24,40,.06),0 12px 28px rgba(16,24,40,.08);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
       -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono)}
  button{font-family:inherit}::selection{background:var(--primary-soft)}
  a{color:inherit}

  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--topbar) 1fr;
       grid-template-areas:"brand top" "side main";height:100vh;overflow:hidden}
  .brand{grid-area:brand;display:flex;align-items:center;gap:10px;padding:0 18px;
         border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface)}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#6366f1);
        display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
  .brand b{font-size:15px;letter-spacing:-.2px}
  .brand .env{margin-left:auto;font-size:10px;color:var(--faint);border:1px solid var(--border);
        padding:2px 6px;border-radius:20px;text-transform:uppercase;letter-spacing:.08em}
  .topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 18px;
          border-bottom:1px solid var(--border);background:var(--surface)}
  .search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;cursor:text;
          background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--muted)}
  .search:hover{border-color:var(--border-strong)}
  .search kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);
          border:1px solid var(--border);border-radius:5px;padding:1px 6px}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;
           color:var(--muted);display:grid;place-items:center;cursor:pointer;position:relative}
  .iconbtn:hover{background:var(--card);color:var(--text)}
  .iconbtn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
  .avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none;width:32px;height:32px}

  .side{grid-area:side;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .switcher{padding:12px;border-bottom:1px solid var(--border)}
  .switcher label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:0 4px 6px;display:block}
  .seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;padding:6px 4px;border-radius:6px;cursor:pointer}
  .seg button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
  .nav{flex:1;overflow-y:auto;padding:8px 10px 20px}
  .nav .group{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:14px 8px 6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--muted);
         text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:1px}
  .nav a svg{width:17px;height:17px;flex:none;opacity:.85}
  .nav a:hover{background:var(--card);color:var(--text)}
  .nav a.active{background:var(--primary-soft);color:var(--primary)}
  .nav a.active svg{opacity:1}
  .nav a .tag{margin-left:auto;font-size:10px;background:var(--primary);color:#fff;border-radius:20px;padding:0 6px;font-weight:700;min-width:18px;text-align:center}
  .side-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .side-foot .who{min-width:0}
  .side-foot .who b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-foot .who span{font-size:11px;color:var(--faint)}

  .main{grid-area:main;overflow-y:auto;padding:22px 26px 60px}
  .page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .page-head h1{font-size:24px;margin:0;letter-spacing:-.4px;text-wrap:balance}
  .page-head p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  .page-head .spacer,.card-h .spacer,.detail-h .spacer{flex:1}
  .btn{border:1px solid var(--border-strong);background:var(--card);color:var(--text);font-weight:600;
       font-size:13px;padding:8px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{border-color:var(--faint)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn svg{width:15px;height:15px}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--card);color:var(--text)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .card .card-h h3{margin:0;font-size:14px;font-weight:650}
  .card .card-h a{font-size:12px;color:var(--primary);text-decoration:none;cursor:pointer}
  .card .card-b{padding:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .kpi .val{font-size:26px;font-weight:720;letter-spacing:-.5px;margin-top:8px}
  .kpi .delta{font-size:12px;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
  .up{color:var(--success)}.down{color:var(--danger)}
  .kpi .spark{margin-top:10px;height:34px;width:100%}
  .grid{display:grid;gap:16px}
  .g-2{grid-template-columns:1.6fr 1fr}.g-2b{grid-template-columns:1fr 1fr}.g-3{grid-template-columns:1fr 1fr 1fr}
  @media (max-width:980px){.g-2,.g-2b,.g-3{grid-template-columns:1fr}}
  .stack{display:flex;flex-direction:column;gap:16px}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
  .pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.green{color:var(--success);background:var(--success-soft)}
  .pill.amber{color:var(--warning);background:var(--warning-soft)}
  .pill.red{color:var(--danger);background:var(--danger-soft)}
  .pill.blue{color:var(--primary);background:var(--primary-soft)}
  .pill.violet{color:var(--violet);background:var(--violet-soft)}
  .pill.grey{color:var(--muted);background:var(--card-2)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 14px 10px}
  tbody td{padding:12px 14px;border-top:1px solid var(--border)}
  tbody tr:hover{background:var(--card-2)}
  tr.clickable{cursor:pointer}
  .t-wrap{overflow-x:auto}
  .who-cell{display:flex;align-items:center;gap:10px}
  .prog{height:6px;border-radius:20px;background:var(--card-2);overflow:hidden;min-width:80px}
  .prog i{display:block;height:100%;background:var(--primary);border-radius:20px}

  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
  .col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-width:230px}
  .col-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:12.5px;font-weight:650}
  .col-h .cnt{margin-left:auto;color:var(--faint);font-weight:600;font-size:11px}
  .col-h .bar{width:8px;height:8px;border-radius:3px}
  .col-b{padding:0 10px 10px;display:flex;flex-direction:column;gap:9px;min-height:40px}
  .tcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 12px;cursor:grab;box-shadow:var(--shadow)}
  .tcard:hover{border-color:var(--border-strong)}
  .tcard .tt{font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.35}
  .tcard .meta{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11px}
  .tcard .meta .spacer{flex:1}
  .money{font-weight:700}

  .feed{margin:0;padding:0;display:flex;flex-direction:column}
  .feed li{list-style:none;display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--border)}
  .feed li:first-child{border-top:0}
  .feed .ico{width:30px;height:30px;border-radius:8px;background:var(--card-2);display:grid;place-items:center;color:var(--muted);flex:none}
  .feed .ico svg{width:15px;height:15px}
  .feed .txt{font-size:13px}.feed .txt b{font-weight:650}
  .feed .txt span{color:var(--faint);font-size:11.5px;display:block;margin-top:2px}

  .ai{background:linear-gradient(160deg,var(--primary-soft),transparent)}
  .ai .insight{display:flex;gap:10px;padding:9px 0;font-size:13px;border-top:1px dashed var(--border)}
  .ai .insight:first-child{border-top:0}
  .ai .insight .k{width:22px;height:22px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700}
  .ai .ask{display:flex;gap:8px;margin-top:12px}
  .ai .ask input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:8px 11px;color:var(--text);font-size:13px}
  .ai .ask input::placeholder{color:var(--faint)}

  .switch{width:38px;height:22px;border-radius:20px;background:var(--card-2);border:1px solid var(--border);position:relative;cursor:pointer;display:inline-block;vertical-align:middle}
  .switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:.15s}
  .switch.on{background:var(--primary-soft);border-color:var(--primary)}
  .switch.on i{left:18px;background:var(--primary)}
  @media (prefers-reduced-motion:reduce){.switch i{transition:none}}

  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .pcard .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .pcard .nm{font-weight:650;font-size:14px}
  .pcard .sub{font-size:11.5px;color:var(--faint)}
  .pcard .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px}
  .empty{color:var(--faint);font-size:13px;padding:20px;text-align:center}
  .muted{color:var(--muted)}.small{font-size:12px}.mt0{margin-top:0}
  h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:22px 0 12px}

  /* subnav tabs */
  .subnav{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
  .subnav button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:10px 13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .subnav button:hover{color:var(--text)}
  .subnav button.active{color:var(--text);border-bottom-color:var(--primary)}
  .back{font-size:12px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;margin-bottom:14px;text-decoration:none}
  .back:hover{color:var(--text)}
  .detail-h{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .avatar-lg{width:50px;height:50px;border-radius:13px;font-size:17px}
  .detail-h h1{font-size:22px;margin:0;letter-spacing:-.3px}
  .detail-h .meta{color:var(--muted);font-size:13px;margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}

  /* calendar */
  .calbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--border);border-top:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
  .cal .dow{padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);text-align:center;background:var(--surface);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .cal .cell{min-height:96px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px 7px}
  .cal .cell.dim{background:var(--surface)}
  .cal .dn{color:var(--muted);font-weight:600;font-size:12px}
  .cal .cell.today .dn{background:var(--primary);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:11px}
  .cal .ev{margin-top:4px;font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--primary-soft);color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .cal .ev.green{background:var(--success-soft);color:var(--success)}
  .cal .ev.amber{background:var(--warning-soft);color:var(--warning)}
  .cal .ev.violet{background:var(--violet-soft);color:var(--violet)}

  /* chat */
  .chat{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - var(--topbar) - 130px);min-height:420px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
  .convlist{border-right:1px solid var(--border);overflow-y:auto}
  .conv{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:10px;align-items:center}
  .conv:hover{background:var(--card-2)}
  .conv.active{background:var(--primary-soft)}
  .conv .cbody{min-width:0;flex:1}
  .conv .cbody b{font-size:13px;display:flex;align-items:center;gap:6px}
  .conv .cbody span{font-size:11.5px;color:var(--faint);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread{display:flex;flex-direction:column;min-width:0}
  .th-h{padding:13px 16px;border-bottom:1px solid var(--border);font-weight:650;font-size:14px;display:flex;align-items:center;gap:10px}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{display:flex;gap:10px;max-width:78%}
  .msg .bub{background:var(--card-2);padding:9px 12px;border-radius:12px;font-size:13px}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .bub{background:var(--primary);color:#fff}
  .msg .nm{font-size:11px;color:var(--faint);margin-bottom:3px}
  .msg.internal .bub{border:1px dashed var(--warning);background:var(--warning-soft);color:var(--text)}
  .composer{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px}
  .composer input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text)}

  /* file rows / integrations / forms */
  .frow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--border)}
  .frow:hover{background:var(--card-2)}
  .ficon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;font-size:10px;font-weight:700}
  .intg .logo2{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
  .field{margin-bottom:16px;max-width:460px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit}
  .rule{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
  .chip{padding:4px 10px;border-radius:8px;font-weight:600;font-size:12px}
  .chip.t{background:var(--primary-soft);color:var(--primary)}
  .chip.c{background:var(--warning-soft);color:var(--warning)}
  .chip.a{background:var(--success-soft);color:var(--success)}
  .arrow{color:var(--faint)}

  .scrim{position:fixed;inset:0;background:rgba(3,7,18,.6);backdrop-filter:blur(3px);display:none;z-index:50;align-items:flex-start;justify-content:center;padding-top:12vh}
  .scrim.open{display:flex}
  .palette{width:min(560px,92vw);background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
  .palette input{width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);font-size:15px;padding:16px 18px;outline:none}
  .palette .results{max-height:340px;overflow-y:auto;padding:8px}
  .palette .res{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
  .palette .res:hover,.palette .res.sel{background:var(--card)}
  .palette .res .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-left:auto}
  .palette .res .ic{width:26px;height:26px;border-radius:7px;background:var(--card-2);display:grid;place-items:center;color:var(--muted)}
  .palette .res .ic svg{width:14px;height:14px}
  .hint{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--faint);display:flex;gap:14px}

  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:var(--topbar) 1fr;grid-template-areas:"top" "main"}
    .brand,.side{display:none}
    .chat{grid-template-columns:1fr}
  }
</style>

<div class="app">
  <div class="brand"><div class="logo">A</div><b>AgencyOS</b><span class="env">Preview</span></div>
  <header class="topbar">
    <div class="search" id="openPalette">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
      <span>Search projects, clients, invoices…</span><kbd>⌘K</kbd>
    </div>
    <div class="top-actions">
      <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
      <button class="iconbtn" title="Notifications" aria-label="Notifications">

      return `<div class="page-head"><div><h1>Welcome back, Cleo</h1><p>Everything from Northwind Studio in one place.</p></div></div>
      <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"><div class="kpi"><div class="lbl">Active projects</div><div class="val num">1</div><div class="small muted" style="margin-top:6px">Website Redesign · 72%</div></div><div class="kpi"><div class="lbl">Outstanding</div><div class="val num">$4,200</div><div class="delta down">Due Jul 24</div></div><div class="kpi"><div class="lbl">Next meeting</div><div class="val" style="font-size:17px">Today 2:00 PM</div><div class="small muted" style="margin-top:6px">Globex weekly sync</div></div></div>
      <div class="grid g-2"><div class="card"><div class="card-h"><h3>Website Redesign</h3><div class="spacer"></div>${healthPill('green')}</div><div class="card-b"><div class="prog" style="height:8px"><i style="width:72%"></i></div><div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px"><span class="muted">72% complete</span><span class="muted">Est. delivery Aug 14</span></div><h2 class="sec">Milestones</h2>${milestones()}</div></div>
      <div class="stack">${card('Outstanding invoices',`<div style="display:flex;align-items:center;gap:10px"><div><div class="mono small muted">INV-00046</div><div class="money num" style="font-size:18px">$4,200</div></div><button class="btn primary" style="margin-left:auto">${svg('dollar')} Pay now</button></div>`)}
      ${card('Recent files',fileList(files.filter(f=>f.vis).slice(0,3)))}</div></div>`;
    },
    cprojects(){
      const p=projects[0];
      return `<div class="page-head"><div><h1>Your projects</h1><p>1 active project with Northwind Studio</p></div></div>
      <div class="cards-grid"><div class="card pcard clickable" data-nav="projectDetail" data-arg="${p.id}"><div class="card-b"><div class="top"><div style="flex:1"><div class="nm">${p.n}</div><div class="sub">Northwind Studio</div></div>${healthPill('green')}</div><div class="prog"><i style="width:${p.prog}%"></i></div><div class="row"><span>${p.prog}% complete</span><span>Due ${p.due}</span></div></div></div></div>`;
    },
    cinvoices(){
      const ci=invoices.filter(i=>i.clid==='globex');
      return `<div class="page-head"><div><h1>Invoices</h1><p>Your billing history with Northwind Studio</p></div></div>
      ${card('',tableH(['Invoice','Amount','Status','Due',''],ci.map(i=>`<tr><td class="mono">${i.no}</td><td class="num money">${money(i.amt)}</td><td>${pill(i.st,i.stc)}</td><td class="muted">${i.due}</td><td style="text-align:right">${i.st==='Paid'?'<button class="btn small">Receipt</button>':'<button class="btn primary small">Pay</button>'}</td></tr>`))).replace('<div class="card-h">','<div class="card-h" style="display:none">')}`;
    },
    ccontracts(){
      const rows=contractsData.filter(c=>c.cl==='Globex');
      return `<div class="page-head"><div><h1>Contracts</h1><p>Review, download, and sign</p></div></div>
      ${card('',tableH(['Document','Status','Activity',''],rows.map(r=>`<tr><td><div class="who-cell">${svg('doc')}<b>${r.t}</b></div></td><td>${pill(r.st,r.stc)}</td><td class="muted">${r.act}</td><td style="text-align:right">${r.st==='Signed'?'<button class="btn small">Download</button>':'<button class="btn primary small">'+svg('sign')+' Sign</button>'}</td></tr>`))).replace('<div class="card-h">','<div class="card-h" style="display:none">')}`;
    },
  };

  /* component fragments */
  function cardInner(title,body){return `<div class="card-h"><h3>${title}</h3></div><div class="card-b">${body}</div>`;}
  function subnav(items,active,view,arg){return `<div class="subnav">${items.map(t=>`<button class="${t===active?'active':''}" data-nav="${view}" ${arg?`data-arg="${arg}"`:''} data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`;}
  function milestones(){return [['Discovery & strategy','done'],['Design system','done'],['Page design','active'],['Development','todo'],['Launch','todo']].map(m=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0"><span style="width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;background:${m[1]==='done'?'var(--success)':m[1]==='active'?'var(--primary-soft)':'var(--card-2)'};color:${m[1]==='done'?'#fff':'var(--primary)'};font-size:11px">${m[1]==='done'?'✓':''}</span><span style="font-size:13px;${m[1]==='todo'?'color:var(--faint)':''}">${m[0]}</span>${m[1]==='active'?'<span class="pill blue" style="margin-left:auto"><span class="d"></span>In progress</span>':''}</div>`).join('');}
  function invoiceTable(list){return tableH(['Invoice','Client','Amount','Status','Due',''],list.map(i=>`<tr><td class="mono">${i.no}</td><td>${i.cl}</td><td class="num money">${money(i.amt)}</td><td>${pill(i.st,i.stc)}</td><td class="muted">${i.due}</td><td style="text-align:right"><button class="btn small">View</button></td></tr>`));}
  function contractsTable(list){return tableH(['Document','Client','Status','Activity',''],list.map(r=>`<tr><td><div class="who-cell">${svg('doc')}<b>${r.t}</b></div></td><td class="muted">${r.cl}</td><td>${pill(r.st,r.stc)}</td><td class="muted">${r.act}</td><td style="text-align:right">${r.st==='Signed'?'<button class="btn small">'+svg('dl')+'</button>':'<button class="btn small">Send</button>'}</td></tr>`));}
  function fileList(list){return list.map(f=>`<div class="frow"><div class="ficon" style="background:${f.c}">${f.t}</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">${f.n}</div><div class="small muted">${f.proj} · ${f.by?people[f.by].n:''} · ${f.when}</div></div>${f.vis?pill('Client-visible','blue'):pill('Internal','grey')}<span class="small muted num" style="width:70px;text-align:right">${f.size}</span><button class="btn ghost small">${svg('dl')}</button></div>`).join('');}
  function discussion(){return `<div class="card"><div class="card-b"><div class="msgs" style="height:auto">${conversations[0].msgs.map(m=>`<div class="msg ${m.me?'me':''}"><div>${!m.me?`<div class="nm">${people[m.f].n}</div>`:''}<div class="bub">${esc(m.b)}</div></div></div>`).join('')}</div><div class="composer" style="border-top:1px solid var(--border);margin:16px -16px -16px"><input placeholder="Reply to the team…"><button class="btn primary">Send</button></div></div></div>`;}
  function donut(pct){const r=42,c=2*Math.PI*r,off=c*(1-pct/100);return `<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--card-2)" stroke-width="12"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--primary)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 55 55)"/><text x="55" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text)">${pct}%</text></svg>`;}
  function monthGrid(){
    const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    let cells='';const startDow=3,days=31,today=4; // Jul 2026 starts Wed
    for(let i=0;i<42;i++){const day=i-startDow+1;const inMonth=day>=1&&day<=days;
      const evs=inMonth&&calEvents[day]?calEvents[day]:[];
      cells+=`<div class="cell ${inMonth?'':'dim'} ${day===today?'today':''}">${inMonth?`<span class="dn">${day}</span>`:''}${evs.map(e=>`<div class="ev ${e[1]}">${e[0]}</div>`).join('')}</div>`;}
    return `<div class="cal">${dows.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
  }
  function miniCalendar(){return `<div class="card"><div class="card-b">${monthGrid()}</div></div>`;}

  /* nav config */
  const G='__group__';
  const portals={
    ceo:{user:people.cara,sub:'Northwind Studio',nav:[
      ['Dashboard','grid','dashboard'],['Clients','users','clients'],['Pipeline','pipeline','crm'],
      ['Projects','folder','projects'],['Tasks','check','tasks'],['Calendar','cal','calendar'],
      ['Messages','chat','messages','2'],['Files','file','files'],['Contracts','doc','contracts'],['Invoices','invoice','invoices'],
      [G,'','Manage'],
      ['Analytics','chart','analytics'],['Team','users','team'],['Permissions','shield','permissions'],
      ['Integrations','plug','integrations'],['Automation','bolt','automation'],['Settings','gear','settings'],
    ]},
    worker:{user:people.wade,sub:'Northwind Studio',nav:[
      ['Dashboard','grid','wdash'],['Projects','folder','projects'],['Tasks','check','tasks'],
      ['Messages','chat','messages','2'],['Calendar','cal','calendar'],['Files','file','files'],['Profile','gear','settings'],
    ]},
    client:{user:people.cleo,sub:'Globex',nav:[
      ['Home','home','cdash'],['Projects','folder','cprojects'],['Invoices','invoice','cinvoices'],
      ['Contracts','doc','ccontracts'],['Messages','chat','messages'],['Meetings','cal','calendar'],['Profile','gear','settings'],
    ]},
  };
  const baseOf={clientDetail:'clients',projectDetail:'projects',permissions:'permissions'};
  const defaultTab={clientDetail:'overview',projectDetail:'overview',settings:'general'};

  let state={portal:'ceo',view:'dashboard',arg:null,tab:null};

  function renderNav(){
    const cfg=portals[state.portal],nav=$('#nav');nav.innerHTML='';
    const activeBase=baseOf[state.view]||state.view;
    cfg.nav.forEach(item=>{
      if(item[0]===G){nav.insertAdjacentHTML('beforeend',`<div class="group">${item[2]}</div>`);return;}
      const [label,icon,view,tag]=item;
      const a=document.createElement('a');
      a.dataset.view=view;a.innerHTML=`${svg(icon)}<span>${label}</span>${tag?`<span class="tag">${tag}</span>`:''}`;
      if(view===activeBase)a.classList.add('active');
      a.addEventListener('click',()=>goto(view));
      nav.appendChild(a);
    });
    const u=cfg.user;
    $('#footName').textContent=u.n;$('#footRole').textContent=`${u.r.split(' · ')[0]} · ${cfg.sub}`;
    $('#footAvatar').textContent=u.i;$('#footAvatar').style.background=u.c;
    $('#topAvatar').textContent=u.i;$('#topAvatar').style.background=u.c;
  }
  function renderMain(){
    const fn=views[state.view]||views.dashboard;
    $('#main').innerHTML=fn(state.arg);
    $('#main').scrollTop=0;
    $('#main').querySelectorAll('.switch').forEach(s=>s.addEventListener('click',e=>{e.stopPropagation();const on=s.classList.toggle('on');s.setAttribute('aria-checked',on);}));
  }
  function goto(view,arg=null,tab=null){
    if(view)state.view=view;
    state.arg=arg;
    state.tab=tab!==null?tab:(defaultTab[state.view]||null);
    renderNav();renderMain();
  }
  // delegate clicks with data-nav
  $('#main').addEventListener('click',e=>{
    const t=e.target.closest('[data-nav]');if(!t)return;
    goto(t.dataset.nav,t.dataset.arg||null,t.dataset.tab!==undefined?t.dataset.tab:null);
  });
  function setPortal(p){
    state.portal=p;const cfg=portals[p];const first=cfg.nav.find(i=>i[0]!==G);
    state.view=first[2];state.arg=null;state.tab=defaultTab[state.view]||null;
    $('#portalSeg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.portal===p));
    renderNav();renderMain();
  }
  $('#portalSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setPortal(b.dataset.portal);});

  $('#themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const isDark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme',isDark?'light':'dark');
  });

  /* command palette */
  const cmds=[
    ...clients.map(c=>({t:c.n,k:'Client',ic:'users',go:['ceo','clientDetail',c.id]})),
    ...projects.map(p=>({t:p.n,k:'Project',ic:'folder',go:['ceo','projectDetail',p.id]})),
    ...invoices.map(i=>({t:i.no+' · '+i.cl,k:'Invoice',ic:'invoice',go:['ceo','invoices']})),
    {t:'Dashboard',k:'Go',ic:'grid',go:['ceo','dashboard']},{t:'Pipeline',k:'Go',ic:'pipeline',go:['ceo','crm']},
    {t:'Analytics',k:'Go',ic:'chart',go:['ceo','analytics']},{t:'Automation',k:'Go',ic:'bolt',go:['ceo','automation']},
    {t:'Integrations',k:'Go',ic:'plug',go:['ceo','integrations']},{t:'Permissions',k:'Go',ic:'shield',go:['ceo','permissions']},
    {t:'Switch to Worker portal',k:'Portal',ic:'check',go:['worker',null]},
    {t:'Switch to Client portal',k:'Portal',ic:'home',go:['client',null]},
  ];
  let sel=0,filtered=cmds;
  const openP=()=>{$('#scrim').classList.add('open');$('#pInput').value='';filtered=cmds;sel=0;drawR();$('#pInput').focus();};
  const closeP=()=>$('#scrim').classList.remove('open');
  function drawR(){$('#pResults').innerHTML=filtered.slice(0,8).map((c,i)=>`<div class="res ${i===sel?'sel':''}" data-i="${i}"><span class="ic">${svg(c.ic)}</span><span>${c.t}</span><span class="k">${c.k}</span></div>`).join('')||'<div class="empty">No matches</div>';
    $('#pResults').querySelectorAll('.res').forEach(r=>r.addEventListener('click',()=>run(filtered[+r.dataset.i])));}
  function run(c){if(!c)return;closeP();if(c.go[1]===null){setPortal(c.go[0]);}else{state.portal=c.go[0];$('#portalSeg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.portal===c.go[0]));goto(c.go[1],c.go[2]||null);}}
  $('#openPalette').addEventListener('click',openP);
  $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeP();});
  $('#pInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase();filtered=cmds.filter(c=>c.t.toLowerCase().includes(q)||c.k.toLowerCase().includes(q));sel=0;drawR();});
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#scrim').classList.contains('open')?closeP():openP();}
    if(!$('#scrim').classList.contains('open'))return;
    if(e.key==='Escape')closeP();
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,Math.min(filtered.length,8)-1);drawR();}
    if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);drawR();}
    if(e.key==='Enter'){e.preventDefault();run(filtered[sel]);}
  });

  renderNav();renderMain();
})();
</script>
